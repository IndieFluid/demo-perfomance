services:
  proxy:
    build:
      context: ../fluid-core
    image: fluid-proxy:latest
    environment:
      PROXY_PORT: "8080"
      # simulated work so the pool's RTT gradient autoscales
      WORK_DELAY_MS: "50"
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # s3 api
      - "9001:9001"   # console

  app:
    build: .
    depends_on:
      - proxy
      - redis
      - minio
    environment:
      HTTP_ADDR: ":8081"
      PROXY_ADDR: "proxy:8080"
      REDIS_ADDR: "redis:6379"
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: jobs
    ports:
      - "8081:8081"
